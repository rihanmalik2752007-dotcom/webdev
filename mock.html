<!doctype html>
<html lang="en">
  <head>
    <style>
      body {
        background-color: lightblue;
        font-family: sans-serif;
        text-align: center;
      }
      h1 {
        color: rgb(9, 9, 114);
      }
      h2 {
        color: blue;
      }
      .card {
        background-color: white;
        border: 1.5px solid black;
        display: inline-block;
        width: 200px;
        padding: 25px;
        border-radius: 5px;
        margin: 10px;
      }
      .card p 
      {
        font-size: 12px;
      }
      button {
        background-color: blue;
        border: 2px solid black;
        font-size: 15px;
        width: 155px;
        padding: 2px;
        color: white;
        border-radius: 5px;
      }
    

      
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>MY COURSES</h1>
    <div class="card">
      <h2>HTML</h2>
      <p>Learn the basics of HTML and create your first webpage</p>
      <button>Start Course</button>
    </div>
    <div class="card">
      <h2>CSS</h2>
      <p>Learn colors, fonts borders and beautiful webpage styling</p>
      <button>Start Course</button>
    </div>
    <div class="card">
      <h2>JavaScript</h2>
      <p>Learn JavaScript and make your webpage interactive</p>
      <button>Start Course</button>
    </div>
    <p>Learn Web Development</p>
  </body>
</html>
